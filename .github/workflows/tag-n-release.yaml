name: release

on:
    workflow_run:
        workflows:
            - build-test
        types:
            - completed

permissions:
    contents: write
    packages: write

jobs:
    release:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true
                    ref: ${{ github.event.workflow_run.head_sha }}

            -   name: Check for releasable changes
                id: check-changes
                run: |
                    set -euo pipefail
                    HEAD_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | tail -n 1)

                    if [[ -n "${HEAD_TAG}" ]]; then
                      PREV_TAG=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | awk -v tag="${HEAD_TAG}" '$0 == tag {print prev; exit} {prev = $0}')
                      if [[ -n "${PREV_TAG}" ]]; then
                        CHANGED_FILES=$(git diff --name-only "${PREV_TAG}"..HEAD -- src/main gradle/libs.versions.toml build.gradle.kts)
                      else
                        CHANGED_FILES=$(git ls-files src/main gradle/libs.versions.toml build.gradle.kts)
                      fi
                    else
                      LATEST_TAG=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | tail -n 1)
                      if [[ -n "${LATEST_TAG}" ]]; then
                        CHANGED_FILES=$(git diff --name-only "${LATEST_TAG}"..HEAD -- src/main gradle/libs.versions.toml build.gradle.kts)
                      else
                        CHANGED_FILES=$(git ls-files src/main gradle/libs.versions.toml build.gradle.kts)
                      fi
                    fi

                    if [[ -n "${CHANGED_FILES}" ]]; then
                      echo "Releasable changes detected:"
                      echo "${CHANGED_FILES}"
                      echo "release_needed=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "No changes detected in src/main, gradle/libs.versions.toml, or build.gradle.kts. Skipping release."
                      echo "release_needed=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Set up JDK
                if: steps.check-changes.outputs.release_needed == 'true'
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: '25'
                    cache: gradle

            -   name: Set up Gradle
                if: steps.check-changes.outputs.release_needed == 'true'
                uses: gradle/actions/setup-gradle@v6

            -   name: Configure git user
                if: steps.check-changes.outputs.release_needed == 'true'
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

            -   name: Git tag
                if: steps.check-changes.outputs.release_needed == 'true'
                id: git-tag
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GROUP_ID: com.github.jactor-rises
                    ARTIFACT_ID: jactor-shared
                run: |
                    set -euo pipefail
                    OWNER=${GITHUB_REPOSITORY%%/*}
                    PACKAGE_NAME="${GROUP_ID}.${ARTIFACT_ID}"
                    PKG_ENCODED=$(printf '%s' "${PACKAGE_NAME}" | jq -sRr @uri)

                    TAG=$(./.github/scripts/bump_tag.sh --dry-run)
                    VERSION=${TAG#v}
                    EXISTS=false

                    if ! gh api "/orgs/${OWNER}/packages/maven/${PKG_ENCODED}/versions" --paginate > /tmp/versions.json 2>/dev/null; then
                      gh api "/users/${OWNER}/packages/maven/${PKG_ENCODED}/versions" --paginate > /tmp/versions.json 2>/dev/null || true
                    fi

                    if [[ -f /tmp/versions.json ]] && jq -e --arg version "${VERSION}" '.[] | select(.name == $version)' /tmp/versions.json > /dev/null 2>&1; then
                      echo "Warning: package version ${VERSION} already exists in GitHub Packages"
                      EXISTS=true
                    fi

                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                    echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

            -   name: Create tag
                if: steps.check-changes.outputs.release_needed == 'true'
                id: create-tag
                env:
                    TAG: ${{ steps.git-tag.outputs.tag }}
                run: |
                    if git rev-parse "${TAG}" >/dev/null 2>&1; then
                      echo "Tag ${TAG} already exists"
                      echo "created=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    git tag -a "${TAG}" -m "Release ${TAG}"
                    git push origin "${TAG}"
                    echo "created=true" >> "$GITHUB_OUTPUT"

            -   name: Publish to GitHub Packages
                if: steps.check-changes.outputs.release_needed == 'true' && steps.git-tag.outputs.exists != 'true'
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./gradlew -Pversion="${{ steps.git-tag.outputs.version }}" publish --stacktrace
