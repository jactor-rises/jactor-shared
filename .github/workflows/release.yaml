name: release

on:
    push:
        tags:
            - 'v[0-9]*.[0-9]*.[0-9]*'
    workflow_run:
        workflows:
            - tag
        types:
            - completed
    workflow_dispatch: { }

permissions:
    contents: write
    packages: write

jobs:
    release:
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true
                    ref: ${{ github.event.workflow_run.head_sha || github.ref }}

            -   name: Resolve release tag
                id: release-tag
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GROUP_ID: com.github.jactor-rises
                    ARTIFACT_ID: jactor-shared
                run: |
                    TAG=""

                    if [[ "${GITHUB_REF_TYPE:-}" == "tag" && -n "${GITHUB_REF_NAME:-}" ]]; then
                      TAG="${GITHUB_REF_NAME}"
                    fi

                    if [[ -z "${TAG}" ]]; then
                      HEAD_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | tail -n 1)
                      if [[ -n "${HEAD_TAG}" ]]; then
                        TAG="${HEAD_TAG}"
                      fi
                     fi

                    if [[ -z "${TAG}" ]]; then
                      echo "No valid tag found for release."
                      echo "release_ready=false" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi

                    VERSION="${TAG#v}"
                    OWNER=${GITHUB_REPOSITORY%%/*}
                    PACKAGE_NAME="${GROUP_ID}.${ARTIFACT_ID}"
                    PKG_ENCODED=$(printf '%s' "${PACKAGE_NAME}" | jq -sRr @uri)
                    EXISTS=false

                    if ! gh api "/orgs/${OWNER}/packages/maven/${PKG_ENCODED}/versions" --paginate > /tmp/versions.json 2>/dev/null; then
                      gh api "/users/${OWNER}/packages/maven/${PKG_ENCODED}/versions" --paginate > /tmp/versions.json 2>/dev/null || true
                    fi

                    if [[ -f /tmp/versions.json ]] && jq -e --arg version "${VERSION}" '.[] | select(.name == $version)' /tmp/versions.json > /dev/null 2>&1; then
                      echo "Warning: package version ${VERSION} already exists in GitHub Packages"
                      EXISTS=true
                    fi

                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                    echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "pkg_exists=${EXISTS}" >> "$GITHUB_OUTPUT"
                    echo "release_needed=true" >> "$GITHUB_OUTPUT"

            -   name: Set up JDK
                if: steps.release-tag.outputs.release_needed == 'true'
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: '25'
                    cache: gradle

            -   name: Set up Gradle
                if: steps.release-tag.outputs.release_needed == 'true'
                uses: gradle/actions/setup-gradle@v6

            -   name: Publish to GitHub Packages
                if: steps.release-tag.outputs.release_needed == 'true' && steps.release-tag.outputs.pkg_exists != 'true'
                continue-on-error: true
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./gradlew -Pversion="${{ steps.release-tag.outputs.version }}" publish --stacktrace

            -   name: Create GitHub Release
                if: steps.release-tag.outputs.release_needed == 'true'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    TAG: ${{ steps.release-tag.outputs.tag }}
                run: |
                    ./gradlew -Pversion="${{ steps.release-tag.outputs.version }}" assemble
                    if gh release view "${TAG}" >/dev/null 2>&1; then
                      echo "GitHub release ${TAG} already exists"
                    else
                      gh release create "${TAG}" build/libs/*.jar --generate-notes --title "${TAG}"
                    fi
