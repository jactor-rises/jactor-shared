name: tag

on:
    workflow_run:
        workflows:
            - build-test
        types:
            - completed
    workflow_dispatch: { }

permissions:
    contents: write

jobs:
    tag:
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true
                    ref: refs/heads/main

            -   name: Refresh to latest main after merge
                if: github.event_name == 'workflow_run'
                shell: bash
                run: |
                    set -euo pipefail
                    git fetch --no-tags --prune origin main
                    git checkout -B main origin/main
                    git reset --hard origin/main
                    git log -1 --oneline

            -   name: Check for releasable changes
                id: check-changes
                run: |
                    set -euo pipefail
                    HEAD_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | tail -n 1)

                    if [[ -n "${HEAD_TAG}" ]]; then
                      PREV_TAG=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | awk -v tag="${HEAD_TAG}" '$0 == tag {print prev; exit} {prev = $0}')
                      if [[ -n "${PREV_TAG}" ]]; then
                        CHANGED_FILES=$(git diff --name-only "${PREV_TAG}"..HEAD -- src/main gradle/libs.versions.toml build.gradle.kts)
                      else
                        CHANGED_FILES=$(git ls-files src/main gradle/libs.versions.toml build.gradle.kts)
                      fi
                    else
                      LATEST_TAG=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | LC_ALL=C sort -V | tail -n 1)
                      if [[ -n "${LATEST_TAG}" ]]; then
                        CHANGED_FILES=$(git diff --name-only "${LATEST_TAG}"..HEAD -- src/main gradle/libs.versions.toml build.gradle.kts)
                      else
                        CHANGED_FILES=$(git ls-files src/main gradle/libs.versions.toml build.gradle.kts)
                      fi
                    fi

                    if [[ -n "${CHANGED_FILES}" ]]; then
                      echo "Releasable changes detected:"
                      echo "${CHANGED_FILES}"
                      echo "release_needed=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "No changes detected in src/main, gradle/libs.versions.toml, or build.gradle.kts. Skipping release."
                      echo "release_needed=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Set up JDK
                if: steps.check-changes.outputs.release_needed == 'true'
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: '25'
                    cache: gradle

            -   name: Set up Gradle
                if: steps.check-changes.outputs.release_needed == 'true'
                uses: gradle/actions/setup-gradle@v6

            -   name: Configure git user
                if: steps.check-changes.outputs.release_needed == 'true'
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

            -   name: Calculate tag
                if: steps.check-changes.outputs.release_needed == 'true'
                id: git-tag
                run: |
                    set -euo pipefail
                    TAG=$(./.github/scripts/bump_tag.sh --dry-run)
                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

            -   name: Create and push tag
                if: steps.check-changes.outputs.release_needed == 'true'
                id: create-tag
                env:
                    TAG: ${{ steps.git-tag.outputs.tag }}
                run: |
                    if git rev-parse "${TAG}" >/dev/null 2>&1; then
                      echo "Tag ${TAG} already exists"
                      exit 0
                    fi
                    git tag -a "${TAG}" -m "Release ${TAG}"
                    git push origin "${TAG}"
